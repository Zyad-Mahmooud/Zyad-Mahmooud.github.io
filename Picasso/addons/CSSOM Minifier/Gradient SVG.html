<script>
function createSVGStop(color, offset) {
  const stop = document.createElementNS("http://www.w3.org/2000/svg", "stop");
  stop.setAttribute("offset", offset || "0%");
  stop.setAttribute("stop-color", color);
  stop.setAttribute("stop-opacity", "1");
  return stop;
}

// تحويل زاوية CSS إلى x1,y1,x2,y2 في SVG
function cssAngleToXY(deg) {
  const rad = (90 - deg) * Math.PI / 180; // تصحيح زاوية CSS إلى نظام SVG
  return {
    x1: 0.5 - 0.5 * Math.cos(rad),
    y1: 0.5 - 0.5 * Math.sin(rad),
    x2: 0.5 + 0.5 * Math.cos(rad),
    y2: 0.5 + 0.5 * Math.sin(rad)
  };
}

const result = Paint.findRule({
  sheet: document.querySelector("style").sheet,
  prop: "--Gradient"
});

result.forEach(rule => {
  const G = rule.ref.style.getPropertyValue("--Gradient");
  if (!G) return;

  const Data = GradientParser.parse(G)[0];
  const svg = document.querySelector("svg.svg-gradient");
  const defs = svg.querySelector("defs");

  // إنشاء linearGradient داخل namespace
  const linear = document.createElementNS("http://www.w3.org/2000/svg", "linearGradient");
  linear.id = "grad" + Math.floor(Math.random() * 10000);

  // حساب الإحداثيات من الزاوية
  if (Data.orientation.type === "angular") {
    const xy = cssAngleToXY(Data.orientation.value);
    linear.setAttribute("x1", xy.x1);
    linear.setAttribute("y1", xy.y1);
    linear.setAttribute("x2", xy.x2);
    linear.setAttribute("y2", xy.y2);
  } else {
    linear.setAttribute("x1", "0%");
    linear.setAttribute("y1", "0%");
    linear.setAttribute("x2", "100%");
    linear.setAttribute("y2", "0%");
  }

  // إضافة الـstops
  Data.colorStops.forEach(c => {
    let color, offset;
    if (c.type === "hex") color = `#${c.value}`;
    else color = `${c.type}(${c.value.toString()})`;
    offset = c.length && c.length.value && c.length.type ? `${c.length.value}${c.length.type}` : "0%";
    linear.appendChild(createSVGStop(color, offset));
  });

  defs.appendChild(linear);

  // تطبيق fill على path
  svg.querySelector("path").setAttribute("fill", `url(#${linear.id})`);
});
</script>
