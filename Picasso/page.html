<html>
<head>
  <title>Page</title>
<link rel="stylesheet" href="./lib/Style/defaults.css">
<link rel="stylesheet" href="./lib/Style/items.css" type="text/css" media="all" />
<script>
    // وظيفة معالجة الجراديانت عند تحميل السكربت الخاص به
    function initGradientParser() {
      window.addEventListener("click", function(event) {
        if(!event.target.hasAttribute("data-function")) {
          var G = getComputedStyle(event.target).backgroundImage;
          if(G != "none") {
            var Data = JSON.parse(Gradient.parse(G));
            var Colors = [];
            Data.stops.forEach((stop) => {
              Colors.push({ color: stop[0], percentage: stop[1] });
            });

            var final = {
              type: Data.type,
              Angle: (() => {
                if (Data.type === "linear-gradient") {
                  return Data.gradientDefinition !== "N/A" ? parseFloat(Data.gradientDefinition) : false;
                } else if (Data.type === "radial-gradient") {
                  return Data.gradientDefinition !== "N/A" ? Data.gradientDefinition : "center";
                }
                return false;
              })(),
              angleType: "from",
              Shape: Data.type === "radial-gradient" ? (Data.shape || "ellipse") : false,
              Colors
            };

            if(typeof window.parent.updateGradientState === "function") {
              window.parent.updateGradientState(final);
            }
          }
        }
      });
    }

    // وظيفة تهيئة الـ Selection
    function initSelectionCore() {
      window.addEventListener("load", () => {
        window.past = { currentHTML: null, currentCSS: null };
      });
    }

    // وظيفة تحميل الستايل الإضافي بعد تحميل Paint.js
    function initPaint() {
      console.log("rootRef is set");
      var link = document.createElement("link");
      link.rel = "stylesheet";
      link.href = "./lib/Style/none.css";
      link.onload = function() {
        window.ComponentsSheet = Paint.getSheetRoot("none.css");
      };
      document.head.appendChild(link);
    }
  </script>
<script type="module">
    import { parse, stringify } from './addons/Selector Parser/Selector Parser.js';
    window.CSSSelector = { parse, stringify };
  </script>
<script src="./addons/Selector Parser/Paint.js" defer onload="initPaint()"></script>
<script src="./lib/core/bitcode-core.js" defer></script>
<script src="./addons/Gradient Parser/index.js" defer onload="initGradientParser()"></script>
<script src="./addons/Selector Parser/picasso-ball.js" defer onload="initBall()"></script>
<script src="./lib/core/selection-core.js" defer onload="initSelectionCore()"></script>
<script src="./lib/Core/items.js" type="text/javascript" charset="utf-8"></script>
  <script>
    window.addEventListener("error", function (err) { console.log(err); });
    window.addEventListener("message", function (err) { console.log(err); });
  </script>
</head>
<body node-id="body">
</body>
</html>
